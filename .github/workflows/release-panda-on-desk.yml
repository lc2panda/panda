# Input: git tag desk-vX.Y.Z 推送 触发跨平台 electron 打包 + GitHub Release 发布
# Output: dist-electron/{*.dmg, *-Setup.exe, *.AppImage, *.deb, *.zip} → GH Release assets
# Pos: panda-on-desk Phase 3 GA Release pipeline god-workflow — 与 packages/panda-on-desk/electron-builder.yml 配套
#
# [NEW-FILE:#20260419-P3-01]
#
# 触发约定：
#   1. 在 packages/panda-on-desk/package.json 更新 version 后，
#   2. 创建并推送 tag desk-vX.Y.Z（X.Y.Z 与 panda-on-desk 子包版本对齐）
#   3. 本 workflow 自动 build mac/win/linux 三平台并 publish 到 GitHub Release
#
# 与主 panda CLI 发版 (`v2.x.y` tag) 解耦：
#   - 本 workflow 仅 desk-v* tag 触发
#   - 主 CI (`.github/workflows/ci.yml`) 仍走 push/PR 路径
#
# v1.0 GA 阶段 dry-run 注意事项：
#   - 实际跑 CI 前需先 `cd packages/panda-on-desk && bun add electron@41 electron-builder@25 electron-updater@6.8 -d`
#   - icon 资产为占位文本，真打包前需替换 build/icons/panda.{png,icns,ico} 为真实图像
#
# GITHUB_TOKEN 用法说明（W4-T4 补全）：
#   - GH_TOKEN env 由 GitHub Actions 自动注入 secrets.GITHUB_TOKEN（无需在仓库 Secrets 里手动配置）
#   - build-* jobs 的 GH_TOKEN：electron-builder 在 `--publish never` 模式下不直接调用 GH API，
#       但内部 metadata 写入 latest*.yml 时会读取它做仓库归属校验 → 注入做防御
#   - publish job 的 GH_TOKEN：gh CLI 创建 draft Release 必需 → 直接走 contents:write 权限
#   - 默认创建 draft Release：维护者手动审核 assets 后再点 "Publish release" 推送给用户

name: Release panda-on-desk

on:
  push:
    tags:
      - 'desk-v*'

# 并发控制：同 tag 重复触发时取消旧 run
concurrency:
  group: release-panda-on-desk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write   # 创建 Release 需要

jobs:
  # ─────────── macOS 打包（dmg + zip / x64 + arm64）───────────
  build-mac:
    name: Build macOS (dmg + zip)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install panda-on-desk deps
        working-directory: packages/panda-on-desk
        run: bun install

      # W6-T2 加固：把 packages/panda-on-desk/package.json 的 version 同步成 tag 里的 version
      # 避免 electron-builder 用过期 version (e.g. 0.1.0-alpha) 命名 artifacts，与 publish job 的 ${RELEASE_VERSION} 错位
      - name: Sync panda-on-desk version with tag
        shell: bash
        working-directory: packages/panda-on-desk
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#desk-v}"
          echo "[W6-T2] Syncing package.json version → ${VERSION} (tag=${TAG_NAME})"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const old=j.version;j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('[W6-T2] version: '+old+' → '+j.version);"

      - name: Compile TypeScript main entry (src/main.ts → src/main.js)
        working-directory: packages/panda-on-desk
        run: bun run build:dist

      # W6-T2 加固：检测 panda.icns 是否文本占位（W3-T3 P3-T2 遗留）→ 用系统自带 sips+iconutil 从 panda.png 现场生成真实 .icns
      - name: Ensure real panda.icns (regenerate if placeholder)
        working-directory: packages/panda-on-desk/build/icons
        run: |
          if file panda.icns | grep -q 'ASCII\|text'; then
            echo "[W6-T2] panda.icns is text placeholder — regenerating from panda.png via sips+iconutil"
            ICONSET="panda.iconset"
            rm -rf "$ICONSET" && mkdir "$ICONSET"
            sips -z 16 16     panda.png --out "$ICONSET/icon_16x16.png"
            sips -z 32 32     panda.png --out "$ICONSET/icon_16x16@2x.png"
            sips -z 32 32     panda.png --out "$ICONSET/icon_32x32.png"
            sips -z 64 64     panda.png --out "$ICONSET/icon_32x32@2x.png"
            sips -z 128 128   panda.png --out "$ICONSET/icon_128x128.png"
            sips -z 256 256   panda.png --out "$ICONSET/icon_128x128@2x.png"
            sips -z 256 256   panda.png --out "$ICONSET/icon_256x256.png"
            sips -z 512 512   panda.png --out "$ICONSET/icon_256x256@2x.png"
            sips -z 512 512   panda.png --out "$ICONSET/icon_512x512.png"
            cp panda.png "$ICONSET/icon_512x512@2x.png"
            iconutil -c icns "$ICONSET" -o panda.icns
            rm -rf "$ICONSET"
            file panda.icns
          else
            echo "[W6-T2] panda.icns already real binary — skip regen"
          fi

      - name: Build (electron-builder mac)
        working-directory: packages/panda-on-desk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # v1.0 不签名 — v1.5 后引入证书
        run: bunx electron-builder --mac --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-on-desk-mac
          path: |
            packages/panda-on-desk/dist-electron/*.dmg
            packages/panda-on-desk/dist-electron/*.zip
            packages/panda-on-desk/dist-electron/*.blockmap
            packages/panda-on-desk/dist-electron/latest-mac.yml
          if-no-files-found: warn
          retention-days: 7

  # ─────────── Windows 打包（NSIS x64）───────────
  build-win:
    name: Build Windows (NSIS)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install panda-on-desk deps
        working-directory: packages/panda-on-desk
        run: bun install

      # W6-T2 加固：把 packages/panda-on-desk/package.json 的 version 同步成 tag 里的 version
      # 避免 electron-builder 用过期 version (e.g. 0.1.0-alpha) 命名 artifacts，与 publish job 的 ${RELEASE_VERSION} 错位
      - name: Sync panda-on-desk version with tag
        shell: bash
        working-directory: packages/panda-on-desk
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#desk-v}"
          echo "[W6-T2] Syncing package.json version → ${VERSION} (tag=${TAG_NAME})"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const old=j.version;j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('[W6-T2] version: '+old+' → '+j.version);"

      - name: Compile TypeScript main entry (src/main.ts → src/main.js)
        working-directory: packages/panda-on-desk
        run: bun run build:dist

      # W6-T2 加固：检测 panda.ico 是否文本占位（W3-T3 P3-T2 遗留）→ 用 PowerShell+System.Drawing 从 panda.png 现场生成真实 .ico
      - name: Ensure real panda.ico (regenerate if placeholder)
        working-directory: packages/panda-on-desk/build/icons
        shell: pwsh
        run: |
          $first = Get-Content -Path panda.ico -TotalCount 1 -ErrorAction SilentlyContinue
          if ($first -match '^#' -or $first -match 'placeholder') {
            Write-Host "[W6-T2] panda.ico is text placeholder — regenerating from panda.png via System.Drawing"
            Add-Type -AssemblyName System.Drawing
            $png = [System.Drawing.Image]::FromFile((Resolve-Path panda.png))
            # ICO header + 单一 256x256 PNG-encoded entry（Vista+ 标准，Win 10/11 NSIS 接受）
            $sizes = @(16, 32, 48, 64, 128, 256)
            $streams = @()
            foreach ($s in $sizes) {
              $bmp = New-Object System.Drawing.Bitmap $s, $s
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
              $g.DrawImage($png, 0, 0, $s, $s)
              $g.Dispose()
              $ms = New-Object System.IO.MemoryStream
              $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
              $streams += ,@{ size = $s; data = $ms.ToArray() }
              $bmp.Dispose()
            }
            $png.Dispose()
            $out = New-Object System.IO.MemoryStream
            $bw = New-Object System.IO.BinaryWriter $out
            # ICONDIR
            $bw.Write([UInt16]0)            # reserved
            $bw.Write([UInt16]1)            # type=icon
            $bw.Write([UInt16]$streams.Count)
            $offset = 6 + (16 * $streams.Count)
            foreach ($e in $streams) {
              $w = if ($e.size -ge 256) { 0 } else { $e.size }
              $bw.Write([Byte]$w); $bw.Write([Byte]$w)
              $bw.Write([Byte]0); $bw.Write([Byte]0)         # palette / reserved
              $bw.Write([UInt16]1); $bw.Write([UInt16]32)    # planes / bpp
              $bw.Write([UInt32]$e.data.Length)
              $bw.Write([UInt32]$offset)
              $offset += $e.data.Length
            }
            foreach ($e in $streams) { $bw.Write($e.data) }
            $bw.Flush()
            [System.IO.File]::WriteAllBytes((Join-Path (Get-Location) 'panda.ico'), $out.ToArray())
            $bw.Dispose(); $out.Dispose()
            Write-Host ("[W6-T2] panda.ico regenerated · {0} bytes" -f (Get-Item panda.ico).Length)
          } else {
            Write-Host "[W6-T2] panda.ico already real binary — skip regen"
          }

      - name: Build (electron-builder win)
        working-directory: packages/panda-on-desk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-on-desk-win
          path: |
            packages/panda-on-desk/dist-electron/*.exe
            packages/panda-on-desk/dist-electron/*.blockmap
            packages/panda-on-desk/dist-electron/latest.yml
          if-no-files-found: warn
          retention-days: 7

  # ─────────── Linux 打包（AppImage + deb x64）───────────
  build-linux:
    name: Build Linux (AppImage + deb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux build deps (rpmbuild + libxss)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm \
            libxss1 \
            libnss3 \
            libgtk-3-0 \
            libgbm1

      - name: Install root deps
        run: bun install --frozen-lockfile

      - name: Install panda-on-desk deps
        working-directory: packages/panda-on-desk
        run: bun install

      # W6-T2 加固：把 packages/panda-on-desk/package.json 的 version 同步成 tag 里的 version
      # 避免 electron-builder 用过期 version (e.g. 0.1.0-alpha) 命名 artifacts，与 publish job 的 ${RELEASE_VERSION} 错位
      - name: Sync panda-on-desk version with tag
        shell: bash
        working-directory: packages/panda-on-desk
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#desk-v}"
          echo "[W6-T2] Syncing package.json version → ${VERSION} (tag=${TAG_NAME})"
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));const old=j.version;j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n');console.log('[W6-T2] version: '+old+' → '+j.version);"

      - name: Compile TypeScript main entry (src/main.ts → src/main.js)
        working-directory: packages/panda-on-desk
        run: bun run build:dist

      - name: Build (electron-builder linux)
        working-directory: packages/panda-on-desk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx electron-builder --linux --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: panda-on-desk-linux
          path: |
            packages/panda-on-desk/dist-electron/*.AppImage
            packages/panda-on-desk/dist-electron/*.deb
            packages/panda-on-desk/dist-electron/latest-linux.yml
          if-no-files-found: warn
          retention-days: 7

  # ─────────── 汇总三平台制品 → 创建 GitHub Release ───────────
  publish:
    name: Publish GitHub Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          # tag 格式 desk-v1.0.0 → version=1.0.0
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#desk-v}"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release/

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find dist-release -type f \( \
            -name '*.dmg' -o \
            -name '*.zip' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.blockmap' -o \
            -name 'latest*.yml' \
          \) -exec cp -v {} release-assets/ \;
          ls -lh release-assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## panda-on-desk v${RELEASE_VERSION}

          跨平台 Electron GUI 增强 — 与 panda CLI (\`@lc2panda/panda-code\`) 配套使用。

          ### 下载

          - **macOS**：\`panda-on-desk-${RELEASE_VERSION}-mac.dmg\` (Intel + Apple Silicon)
          - **Windows**：\`panda-on-desk-${RELEASE_VERSION}-Setup.exe\` (NSIS x64)
          - **Linux**：\`panda-on-desk-${RELEASE_VERSION}.AppImage\` 或 \`.deb\`

          ### 安装

          详见主仓库 [README.md](https://github.com/lc2panda/panda#panda-on-desk) → panda-on-desk 子产品章节。

          ### 与 panda CLI 关系

          panda-on-desk 是 panda CLI 的可选 GUI 增强，通过本地 HTTP (1455+) + SSE 订阅 panda CLI 状态信号。panda CLI 不依赖 panda-on-desk 即可独立运行（\`bun panda\` 仍是 TUI 主体验）。

          ---
          > 自动生成于 ${RELEASE_TAG} tag 推送时。
          EOF
          gh release create "${RELEASE_TAG}" \
            --title "panda-on-desk v${RELEASE_VERSION}" \
            --notes-file "$NOTES_FILE" \
            --draft \
            release-assets/*
