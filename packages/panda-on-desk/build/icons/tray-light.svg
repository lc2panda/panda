<?xml version="1.0" encoding="UTF-8"?>
<!--
  Input: 矢量源 — scripts/build-icons.cjs 转 256×256 PNG 给托盘使用
  Output: tray-light.png — 浅色背景下使用的暗色 panda tray icon
  Pos: panda-on-desk Phase 3 P3-T5 美术资产 — 系统托盘图标（浅色版）
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" data-icon="tray-light">
  <!-- 透明背景 -->
  <rect width="256" height="256" fill="transparent"/>
  <!-- 耳朵 -->
  <ellipse cx="68" cy="76" rx="32" ry="30" fill="#0d0d0d"/>
  <ellipse cx="188" cy="76" rx="32" ry="30" fill="#0d0d0d"/>
  <!-- 脸 -->
  <circle cx="128" cy="138" r="100" fill="#1a1a1a" stroke="#0d0d0d" stroke-width="4"/>
  <!-- 眼罩 -->
  <ellipse cx="96" cy="120" rx="22" ry="28" fill="#000000" transform="rotate(-12 96 120)"/>
  <ellipse cx="160" cy="120" rx="22" ry="28" fill="#000000" transform="rotate(12 160 120)"/>
  <!-- 眼球 -->
  <circle cx="96" cy="120" r="7" fill="#ffffff"/>
  <circle cx="160" cy="120" r="7" fill="#ffffff"/>
  <!-- 鼻 -->
  <ellipse cx="128" cy="160" rx="10" ry="7" fill="#000000"/>
  <!-- 嘴 -->
  <path d="M 120 178 Q 128 188 136 178" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
