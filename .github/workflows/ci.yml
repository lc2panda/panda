name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: E2E real-process (panda CLI ↔ panda-on-desk bridge)
        # W5-T1：真双进程 IPC 实测（无 GUI / 无 xvfb）
        # 单测套件已包含此文件，但单独显式跑一次便于 CI 输出隔离审查
        run: bun test packages/panda-on-desk/test/e2e-real-process.test.ts

      - name: Build
        run: bun run build
