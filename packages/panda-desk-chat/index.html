<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' http://127.0.0.1:1455 http://127.0.0.1:1456 http://127.0.0.1:1457 http://127.0.0.1:1458 http://127.0.0.1:1459 http://127.0.0.1:1460; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline';"
    />
    <title>Panda Chat</title>
    <!-- FOUC prevention: sync theme before first paint -->
    <script>
      (function() {
        var stored = localStorage.getItem('pd-theme') || 'system';
        var theme = stored;
        if (stored === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-pd-theme', theme);
        // Matrix variant
        var variant = localStorage.getItem('pd-variant') || '';
        if (variant) document.documentElement.setAttribute('data-pd-variant', variant);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
